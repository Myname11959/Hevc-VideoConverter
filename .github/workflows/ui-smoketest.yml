name: UI Smoketest
on:
  push:
  pull_request:

jobs:
  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: System deps (ffmpeg + xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Python deps
        run: |
          python -m pip install -U pip
          pip install PyQt5 ruff

      - name: Generate test asset
        run: |
          mkdir -p tests/assets
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i sine=frequency=440:duration=5 \
            -c:a pcm_s16le tests/assets/mono.wav

      - name: Ruff (optional, non-blocking)
        run: |
          ruff check .
        continue-on-error: true

      - name: Run UI smoketest (headless)
        run: xvfb-run -a python tools/ui_smoketest_audio.py tests/assets/mono.wav --sb51
