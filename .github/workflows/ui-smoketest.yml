name: UI Smoketest

on:
  push:
  pull_request:

jobs:
  smoketest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps (Qt headless + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg xvfb \
            libgl1 libegl1 \
            libxkbcommon-x11-0 \
            libxcb-xinerama0 libxcb-cursor0 \
            libdbus-1-3

      - name: Install python deps
        run: |
          python -m pip install -U pip
          python -m pip install PyQt5 pyqtgraph numpy psutil chardet

      - name: Smoketest import (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a python -c "import PyQt5; import hevc_gui; from hevc_gui.gui import main_window; print('OK')"

