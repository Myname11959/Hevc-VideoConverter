name: AF Tests

on:
  push:
  pull_request:

jobs:
  af:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install python deps
        run: |
          python -m pip install -U pip
          python -m pip install numpy psutil chardet  PyQt5 pyqtgraph

      - name: Compileall
        run: python -m compileall -q .

      - name: Minimal import tests (core)
        run: |
          python -c "from hevc_gui.core import constants; print('OK constants')"
          
