name: Ruff

on:
  push:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ruff.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ruff.yml"

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # Verifica formattazione senza modificare i file (fallisce se non formattati)
      - name: Check format
        run: ruff format --force-exclude --check

      # Lint completo (usa le regole dal tuo pyproject.toml)
      - name: Lint
        run: ruff check --force-exclude

