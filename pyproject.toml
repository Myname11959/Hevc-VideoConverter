[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = [
  "packaging", "_backup", "_export",
  "backup", "tests/assets", "__pycache__", "logs", "scripts/log", "tmp", "build", "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"hevc_gui/gui/main_window.py" = ["E402"]
"main.py" = ["E402"]
"hevc_gui/core/loudness.py" = ["E741"]

[tool.ruff.format]

[project]
name = "hevc-video-converter"
version = "2.1.0.0"